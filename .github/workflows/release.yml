name: Release AppImages

on:
  push:
    tags:
      - "v*-agx-client"
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Existing workflow run whose artifacts should be published
        required: true
        type: string

permissions:
  actions: read
  contents: write

jobs:
  build:
    name: Build Linux ${{ matrix.arch }}
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run build:linux:agx-client

      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: dist/CapsWriter-GUI-*-linux-${{ matrix.arch }}.AppImage
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: build
    if: ${{ always() && (github.event_name == 'push' || inputs.source_run_id != '') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event_name == 'workflow_dispatch' && inputs.source_run_id || github.run_id }}

      - name: Generate checksums
        working-directory: release-assets
        run: sha256sum CapsWriter-GUI-*.AppImage > SHA256SUMS.txt

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          release-assets/CapsWriter-GUI-*.AppImage
          release-assets/SHA256SUMS.txt
          --title "CapsWriter AGX Client ${GITHUB_REF_NAME#v}"
          --generate-notes
