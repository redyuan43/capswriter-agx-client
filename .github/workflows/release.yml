name: Release AppImages

on:
  push:
    tags:
      - "v*-agx-client"
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Existing workflow run whose artifacts should be published; leave empty to rebuild
        required: false
        default: ""
        type: string
      release_tag:
        description: Existing Git tag that the release should use
        required: true
        type: string

permissions:
  actions: read
  contents: write

jobs:
  build:
    name: Build Linux ${{ matrix.arch }}
    if: ${{ github.event_name == 'push' || inputs.source_run_id == '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install Linux native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 pkg-config libx11-dev libxrandr-dev libxtst-dev libxt-dev

      - run: pnpm install --frozen-lockfile

      - run: pnpm run build:linux:agx-client

      - run: pnpm run verify:appimage:native

      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: dist/CapsWriter-GUI-*-linux-${{ matrix.arch }}.AppImage
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: build
    if: ${{ always() && ((github.event_name == 'push' && needs.build.result == 'success') || (github.event_name == 'workflow_dispatch' && (inputs.source_run_id != '' || needs.build.result == 'success'))) }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}

      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event_name == 'workflow_dispatch' && inputs.source_run_id || github.run_id }}

      - name: Prepare Linux installation assets
        run: |
          cp assets/tray-icon.png release-assets/capswriter-agx-client.png
          cp scripts/m5bridge-doctor.py release-assets/m5bridge-doctor.py
          cp scripts/capswriter-m5-recover-bluetooth release-assets/capswriter-m5-recover-bluetooth
          cp scripts/com.speechtranscription.m5-recover.policy release-assets/com.speechtranscription.m5-recover.policy
          cp scripts/49-capswriter-m5-recover.rules release-assets/49-capswriter-m5-recover.rules

      - name: Generate checksums
        working-directory: release-assets
        run: |
          sha256sum \
            CapsWriter-GUI-*.AppImage \
            capswriter-agx-client.png \
            m5bridge-doctor.py \
            capswriter-m5-recover-bluetooth \
            com.speechtranscription.m5-recover.policy \
            49-capswriter-m5-recover.rules \
            > SHA256SUMS.txt

      - name: Prepare Linux installer
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: |
          sed "s/@RELEASE_TAG@/${RELEASE_TAG}/g" scripts/install-linux-client.sh \
            > release-assets/install-capswriter-agx-client.sh
          chmod +x release-assets/install-capswriter-agx-client.sh

      - name: Prepare release installation notes
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: |
          cat > release-assets/linux-install-notes.md <<EOF
          ## Linux one-command installation

          This private release includes \`install-capswriter-agx-client.sh\`.
          Run the following commands in the target user's graphical desktop session:

          \`\`\`bash
          gh auth login
          mkdir -p "\$HOME/.cache/capswriter-installer"
          gh release download "${RELEASE_TAG}" \\
            --repo "${GITHUB_REPOSITORY}" \\
            --pattern "install-capswriter-agx-client.sh" \\
            --dir "\$HOME/.cache/capswriter-installer" \\
            --clobber
          bash "\$HOME/.cache/capswriter-installer/install-capswriter-agx-client.sh"
          \`\`\`

          The installer verifies the AppImage checksum, installs the matching CPU architecture,
          enables desktop-login autostart, and starts CapsWriter in tray/background mode.
          EOF

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: |
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" \
              release-assets/CapsWriter-GUI-*.AppImage \
              release-assets/capswriter-agx-client.png \
              release-assets/m5bridge-doctor.py \
              release-assets/capswriter-m5-recover-bluetooth \
              release-assets/com.speechtranscription.m5-recover.policy \
              release-assets/49-capswriter-m5-recover.rules \
              release-assets/SHA256SUMS.txt \
              release-assets/install-capswriter-agx-client.sh \
              --clobber
          else
            gh release create "${RELEASE_TAG}" \
              release-assets/CapsWriter-GUI-*.AppImage \
              release-assets/capswriter-agx-client.png \
              release-assets/m5bridge-doctor.py \
              release-assets/capswriter-m5-recover-bluetooth \
              release-assets/com.speechtranscription.m5-recover.policy \
              release-assets/49-capswriter-m5-recover.rules \
              release-assets/SHA256SUMS.txt \
              release-assets/install-capswriter-agx-client.sh \
              --title "CapsWriter AGX Client ${RELEASE_TAG#v}" \
              --notes "$(cat release-assets/linux-install-notes.md)" \
              --generate-notes
          fi
